name: Test and deploy

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ai_service: ${{ steps.filter.outputs.ai_service }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          backend:
            - 'backend/**'
            - '.github/workflows/cicd-package.yml'
          frontend:
            - 'frontend/**'
            - '.github/workflows/cicd-package.yml'
          ai_service:
            - 'ai_service/**'
            - '.github/workflows/cicd-package.yml'

  backend-tests:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: barberia_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v7
    - name: Set up Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Backend dependencies
      run: |
        cd backend
        npm install

    - name: Load schema into test database
      env:
        PGPASSWORD: postgres
      run: psql -h localhost -U postgres -d barberia_test -f backend/database/init_database.sql

    - name: Test backend with npm
      env:
        ENV: local
        DB_HOST: localhost
        DB_NAME: barberia_test
        DB_USER: postgres
        DB_PASSWORD: postgres
        AI_SERVICE_URL: ci-test-ai-url
        AI_SERVICE_API_KEY: ci-test-ai-key
        AI_PROVIDER: ci-test-ai-provider
        JWT_SECRET: ci-test-secret
        FRONTEND_URL: ci-test-frontend-url
        AWS_ACCESS_KEY_ID: ci-test-aws-access-key
        AWS_SECRET_ACCESS_KEY: ci-test-aws-secret
        AWS_REGION: ci-test-2
        AWS_BUCKET: ci-test-imagenes
        AWS_BUCKET_KEY_PREFIX: ci-test/images/
      run: |
        cd backend
        npx tsc -b --noEmit
        npm run lint
        npm test

    - name: Prettier check (backend)
      working-directory: backend
      run: npm run prettier || echo "::warning title=Prettier::Backend files are not formatted correctly"

  frontend-tests:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend dependencies
      run: |
        cd frontend
        npm install --legacy-peer-deps

    - name: Check build on frontend
      run: npx tsc -b --noEmit

    - name: Check linter on frontend
      working-directory: frontend
      run: npm run lint

    - name: Prettier check (frontend)
      working-directory: frontend
      run: npm run prettier || echo "::warning title=Prettier::Frontend files are not formatted correctly"

  ai-service-tests:
    needs: [changes]
    if: needs.changes.outputs.ai_service == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        enable-cache: true

    - name: Install AI service dependencies
      run: |
        cd ai_service
        uv sync --frozen

    - name: Test AI service with pytest
      env:
        AI_SERVICE_API_KEY: ci-test-ai-key
      run: |
        cd ai_service
        uv run pytest

  # Aggregate gate: keeps the "test" name for branch protection and the deploy
  # jobs. Skipped test jobs count as passing; failed or cancelled ones do not.
  test:
    needs: [changes, backend-tests, frontend-tests, ai-service-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check test results
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1

  frontend-deploy:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v7
    - name: Set up Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install Frontend dependencies
      run: |
        cd frontend
        npm install --legacy-peer-deps

    - name: Build Frontend
      run: |
        cd frontend
        npm run build

    - name: Deploy to Cloudflare (production)
      if: github.ref == 'refs/heads/main'
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        workingDirectory: frontend
        command: deploy

  docker-hub:
    runs-on: ubuntu-latest
    environment: Production
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v7

    - name: Build & Push Docker image to Docker Hub
      uses: mr-smithers-excellent/docker-build-push@v5
      with:
        image: jesusvelazquezmx/barberia
        tags: latest
        registry: docker.io
        dockerfile: Dockerfile
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

  backend-deploy:
      runs-on: ubuntu-latest
      environment: Production
      needs: [docker-hub]
      steps:
        - name: Conectar a AWS y actualizar Docker
          uses: appleboy/ssh-action@master
          with:
            host: ${{ secrets.AWS_HOST }} 
            username: ubuntu 
            key: ${{ secrets.AWS_SSH_KEY }} 
            script: |
             # Descargar la última imagen 
              sudo docker pull jesusvelazquezmx/barberia:latest

              # Borrar la imagen vieja
              sudo docker rm -f barberia || true

              # Correr la nueva imagen con las variables de entorno
              sudo docker run --name barberia -d --network host --restart unless-stopped \
                -e DB_HOST=${{ secrets.DB_HOST }} \
                -e DB_NAME=${{ secrets.DB_NAME }} \
                -e DB_USER=${{ secrets.DB_USER }} \
                -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
                -e AI_SERVICE_URL=${{ secrets.AI_SERVICE_URL }} \
                -e AI_SERVICE_API_KEY=${{ secrets.AI_SERVICE_API_KEY }} \
                -e AI_PROVIDER=${{ vars.AI_PROVIDER }} \
                -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
                -e FRONTEND_URL=${{ vars.FRONTEND_URL }} \
                -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
                -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
                -e AWS_REGION=${{ secrets.AWS_REGION }}\
                -e AWS_BUCKET=${{ secrets.AWS_BUCKET }} \
                -e AWS_BUCKET_KEY_PREFIX=${{ secrets.AWS_BUCKET_KEY_PREFIX }} \
                jesusvelazquezmx/barberia:latest

              # Limpiar imágenes no utilizadas
              sudo docker image prune -f