name: Node.js CI with Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: QA
    steps:
    - uses: actions/checkout@v5
    - name: Set up Node.js 24
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
        
    - name: Install Backend dependencies
      run: |
        cd backend
        npm install
        
    - name: Install Frontend dependencies
      run: |
        cd frontend
        npm install
        
    - name: Test with npm
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      run: |
        cd backend
        npm test

  package:
    runs-on: ubuntu-latest
    environment: Staging
    needs: [test]
    steps:
    - uses: actions/checkout@v5
    - name: Set up Node.js 24
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
        
    - name: Install Frontend dependencies
      run: |
        cd frontend
        npm install
        
    - name: Build Vue App
      run: |
        cd frontend
        npm run build
        
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v5
      with:
        name: vue-build
        path: frontend/dist 
        
  docker-hub:
    runs-on: ubuntu-latest
    environment: Production
    needs: [package]
    steps:
    - uses: actions/checkout@v5
    
    - name: Create dist directory
      run: mkdir -p frontend/dist
      
    - name: Download Vue Build
      uses: actions/download-artifact@v5
      with:
        name: vue-build
        path: frontend/dist
        
    - name: Build & Push Docker image to Docker Hub
      uses: mr-smithers-excellent/docker-build-push@v5
      with:
        image: jesusvelazquezmx/barberia
        tags: latest
        registry: docker.io
        dockerfile: Dockerfile
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

  deploy:
      runs-on: ubuntu-latest
      environment: Production
      needs: [docker-hub]
      steps:
        - name: Conectar a AWS y actualizar Docker
          uses: appleboy/ssh-action@master
          with:
            host: ${{ secrets.AWS_HOST }} 
            username: ubuntu 
            key: ${{ secrets.AWS_SSH_KEY }} 
            script: |
             # Descargar la última imagen 
              sudo docker pull jesusvelazquezmx/barberia:latest

              # Borrar la imagen vieja
              sudo docker rm -f barberia || true

              # Correr la nueva imagen con las variables de entorno
              sudo docker run --name barberia -d -p 3000:3000 \
                -e DB_HOST=${{ secrets.DB_HOST }} \
                -e DB_NAME=${{ secrets.DB_NAME }} \
                -e DB_USER=${{ secrets.DB_USER }} \
                -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
                jesusvelazquezmx/barberia:latest

              # Limpiar imágenes no utilizadas
              sudo docker image prune -f