name: Node.js CI with Docker

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: barberia_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v5
    - name: Set up Node.js 24
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install Backend dependencies
      run: |
        cd backend
        npm install

    - name: Install Frontend dependencies
      run: |
        cd frontend
        npm install --legacy-peer-deps

    - name: Load schema into test database
      env:
        PGPASSWORD: postgres
      run: psql -h localhost -U postgres -d barberia_test -f backend/database/init_database.sql

    - name: Test with npm
      env:
        ENV: local
        DB_HOST: localhost
        DB_NAME: barberia_test
        DB_USER: postgres
        DB_PASSWORD: postgres
        JWT_SECRET: ci-test-secret
        AI_SERVICE_URL: ci-test-ai-url
        FRONTEND_URL: ci-test-frontend-url
      run: |
        cd backend
        npm test

  frontend-deploy:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v5
    - name: Set up Node.js 24
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install Frontend dependencies
      run: |
        cd frontend
        npm install --legacy-peer-deps

    - name: Build Frontend
      run: |
        cd frontend
        npm run build

    - name: Deploy to Cloudflare (production)
      if: github.ref == 'refs/heads/main'
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        workingDirectory: frontend
        command: deploy

  docker-hub:
    runs-on: ubuntu-latest
    environment: Production
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v5

    - name: Build & Push Docker image to Docker Hub
      uses: mr-smithers-excellent/docker-build-push@v5
      with:
        image: jesusvelazquezmx/barberia
        tags: latest
        registry: docker.io
        dockerfile: Dockerfile
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

  backend-deploy:
      runs-on: ubuntu-latest
      environment: Production
      needs: [docker-hub]
      steps:
        - name: Conectar a AWS y actualizar Docker
          uses: appleboy/ssh-action@master
          with:
            host: ${{ secrets.AWS_HOST }} 
            username: ubuntu 
            key: ${{ secrets.AWS_SSH_KEY }} 
            script: |
             # Descargar la última imagen 
              sudo docker pull jesusvelazquezmx/barberia:latest

              # Borrar la imagen vieja
              sudo docker rm -f barberia || true

              # Correr la nueva imagen con las variables de entorno
              sudo docker run --name barberia -d --network host \
                -e DB_HOST=${{ secrets.DB_HOST }} \
                -e DB_NAME=${{ secrets.DB_NAME }} \
                -e DB_USER=${{ secrets.DB_USER }} \
                -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
                -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
                -e AI_SERVICE_URL=${{ secrets.AI_SERVICE_URL }} \
                -e FRONTEND_URL=${{ secrets.FRONTEND_URL }} \
                -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
                -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
                -e AWS_REGION=${{ secrets.AWS_REGION }}\
                -e AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }} \
                jesusvelazquezmx/barberia:latest

              # Limpiar imágenes no utilizadas
              sudo docker image prune -f