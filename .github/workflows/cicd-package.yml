name: Node.js CI with Docker

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: QA
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
        
    - name: Install Backend dependencies
      run: |
        cd backend
        npm install
        
    - name: Install Frontend dependencies
      run: |
        cd frontend
        npm install
        
    - name: Test with npm
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      run: |
        cd backend
        npm test

  frontend-deploy:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install Frontend dependencies
      run: |
        cd frontend
        npm install

    - name: Build Frontend
      run: |
        cd frontend
        npm run build

    - name: Deploy to Cloudflare (staging)
      if: github.ref == 'refs/heads/dev'
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        workingDirectory: frontend
        command: deploy --env staging

    - name: Deploy to Cloudflare (production)
      if: github.ref == 'refs/heads/main'
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        workingDirectory: frontend
        command: deploy

  docker-hub:
    runs-on: ubuntu-latest
    environment: Production
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Build & Push Docker image to Docker Hub
      uses: mr-smithers-excellent/docker-build-push@v5
      with:
        image: jesusvelazquezmx/barberia
        tags: latest
        registry: docker.io
        dockerfile: Dockerfile
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

  backend-deploy:
      runs-on: ubuntu-latest
      environment: Production
      needs: [docker-hub] # Solo se ejecuta si la imagen se subió con éxito
      steps:
        - name: Conectar a AWS y actualizar Docker
          uses: appleboy/ssh-action@master
          with:
            host: ${{ secrets.AWS_HOST }} # La IP del servidor EC2
            username: ubuntu # super usuario que viene con la imagen de AWS
            key: ${{ secrets.AWS_SSH_KEY }} # La llave .pem de AWS
            script: |
              # 1. Descarga la imagen más reciente
              sudo docker pull jesusvelazquezmx/barberia:latest
              
              # 2. Borra el contenedor viejo
              sudo docker rm -f barberia || true
              
              # 3. Levanta el nuevo inyectando las contraseñas
              sudo docker run --name barberia -d -p 3000:3000 \
                -e DB_HOST=${{ secrets.DB_HOST }} \
                -e DB_NAME=${{ secrets.DB_NAME }} \
                -e DB_USER=${{ secrets.DB_USER }} \
                -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
                jesusvelazquezmx/barberia:latest
              
              # 4. Limpia la basura (imágenes viejas) para no llenar el disco duro
              sudo docker image prune -f