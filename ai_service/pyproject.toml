[project]
name = "ai-service"
version = "0.1.0"
description = "AI microservice for job position analysis, resume tailoring and profile scoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "fastapi>=0.141.1",
    "ollama>=0.6.3",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx2>=0.22.0",
    "pytest>=8.4.1",
]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*.test.py"]
pythonpath = ["."]
